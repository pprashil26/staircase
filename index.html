<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STAIRCASE</title>
  <style>
    :root {
      --bg:#fafafa; --panel:#fff; --text:#18181b; --muted:#71717a;
      --line:#e4e4e7; --line-dark:#d4d4d8; --black:#18181b;
      --shadow:0 1px 2px rgba(0,0,0,.04);
      --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
    .wrap{max-width:880px;margin:0 auto;padding:12px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:10px}
    h1{margin:0;font-size:24px;line-height:1.1;letter-spacing:-.03em}
    .sub{margin-top:2px;color:var(--muted);font-size:12px}
    .toolbar,.filters,.task-actions,.phase-head{display:flex;align-items:center;gap:6px}
    button,.file-label,select,input{font:inherit}
    button,.file-label{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:6px 9px;cursor:pointer;box-shadow:var(--shadow);line-height:1;white-space:nowrap;text-decoration:none}
    button:hover,.file-label:hover{background:#f4f4f5}
    .primary{background:var(--black);color:#fff;border-color:var(--black)}
    .primary:hover{background:#3f3f46}
    .danger:hover{color:#dc2626;border-color:#fecaca;background:#fef2f2}
    .phases{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
    .phase-card{text-align:left;padding:8px;border-radius:12px;border:1px solid var(--line);box-shadow:none;min-width:0}
    .phase-card.active{outline:2px solid #71717a;outline-offset:1px}
    .phase-short{font-weight:700;font-size:13px}
    .count{margin-left:auto;background:rgba(255,255,255,.75);border-radius:999px;padding:2px 6px;font-size:10px}
    .phase-label{margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
    .registration{background:#f1f5f9;color:#334155;border-color:#e2e8f0}
    .collection{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
    .analysis{background:#fffbeb;color:#b45309;border-color:#fde68a}
    .solutions{background:#faf5ff;color:#7e22ce;border-color:#e9d5ff}
    .execution{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow);margin-bottom:10px}
    .add-grid{display:grid;grid-template-columns:1fr 140px auto;gap:8px}
    input,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff;color:var(--text);outline:none}
    input:focus,select:focus{border-color:var(--line-dark);box-shadow:0 0 0 2px #e4e4e7}
    #noteInput{margin-top:8px;font-size:12px}
    .controls-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px}
    .filters{font-size:12px;color:var(--muted)}
    .check-label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 8px;white-space:nowrap}
    .check-label input{width:auto;margin:0}
    .task-list{display:grid;gap:6px}
    .task{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow)}
    .task.done{opacity:.55}
    .task-main{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start}
    .done-check{width:18px;height:18px;margin-top:2px;cursor:pointer;accent-color:#18181b}
    .task-title-row{display:flex;align-items:center;gap:6px;min-width:0}
    .tag{border:1px solid currentColor;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;line-height:1.2;flex:0 0 auto}
    .task-title{border:0;padding:0;border-radius:0;font-weight:600;min-width:120px;background:transparent}
    .task-title:focus,.task-note:focus{box-shadow:none;border-color:transparent}
    .task.done .task-title{text-decoration:line-through}
    .task-note{margin-top:5px;border:0;padding:0;border-radius:0;font-size:12px;color:var(--muted);background:transparent}
    .task-actions button{width:28px;height:28px;padding:0;box-shadow:none;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
    .empty{text-align:center;color:var(--muted);border:1px dashed var(--line-dark);border-radius:16px;background:#fff;padding:28px 8px}
    footer{text-align:center;color:#a1a1aa;font-size:11px;margin-top:14px}
    .hidden{display:none!important}
    @media(max-width:640px){
      header{align-items:flex-start;flex-direction:column}.toolbar{flex-wrap:wrap}.phase-label{display:none}.phase-card{padding:7px}.add-grid{grid-template-columns:1fr}.controls-row{justify-content:flex-start}.filters{justify-content:space-between;width:100%}.task-main{grid-template-columns:auto 1fr}.task-actions{grid-column:2;justify-content:flex-end}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>STAIRCASE</h1>
        <div class="sub">Minimal GTD-inspired task lifecycle: RCASE</div>
      </div>
      <div class="toolbar">
        <button id="exportBtn" type="button">Export</button>
        <label class="file-label" for="importFile">Import</label>
        <input id="importFile" class="hidden" type="file" accept="application/json">
        <button id="resetBtn" type="button">Reset</button>
      </div>
    </header>

    <section id="phaseBar" class="phases"></section>

    <form id="addForm" class="panel">
      <div class="add-grid">
        <input id="titleInput" autocomplete="off" placeholder="Add task, idea, promise, issue...">
        <select id="phaseInput"></select>
        <button class="primary" type="submit">Add</button>
      </div>
      <input id="noteInput" autocomplete="off" placeholder="Optional note, next action, context, waiting-for detail...">
    </form>

    <section class="controls-row">
      <div class="filters">
        <button id="allBtn" type="button">All</button>
        <label class="check-label"><input id="showDoneInput" type="checkbox" checked> Done</label>
      </div>
    </section>

    <main id="taskList" class="task-list"></main>
    <footer>Registration &rarr; Collection &rarr; Analysis &rarr; Solutions &rarr; Execution</footer>
  </div>

  <script>
    const PHASES = [
      { key:'registration', short:'R', label:'Registration' },
      { key:'collection', short:'C', label:'Collection' },
      { key:'analysis', short:'A', label:'Analysis' },
      { key:'solutions', short:'S', label:'Solutions' },
      { key:'execution', short:'E', label:'Execution' }
    ];
    const STORAGE_KEY = 'staircase-rcase-v2';
    let tasks = [];
    let filter = 'all';
    let showDone = true;

    const phaseBar = document.getElementById('phaseBar');
    const addForm = document.getElementById('addForm');
    const titleInput = document.getElementById('titleInput');
    const noteInput = document.getElementById('noteInput');
    const phaseInput = document.getElementById('phaseInput');
    const showDoneInput = document.getElementById('showDoneInput');
    const taskList = document.getElementById('taskList');
    const allBtn = document.getElementById('allBtn');
    const exportBtn = document.getElementById('exportBtn');
    const importFile = document.getElementById('importFile');
    const resetBtn = document.getElementById('resetBtn');

    function uid(){ return Date.now() + '-' + Math.random().toString(16).slice(2); }
    function phaseMeta(key){ return PHASES.find(p => p.key === key) || PHASES[0]; }
    function phaseIndex(key){ const i = PHASES.findIndex(p => p.key === key); return i < 0 ? 0 : i; }
    function nextPhase(key){ return PHASES[Math.min(phaseIndex(key) + 1, PHASES.length - 1)].key; }
    function prevPhase(key){ return PHASES[Math.max(phaseIndex(key) - 1, 0)].key; }
    function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
    function escapeHtml(value){
      return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    function sampleTasks(){
      const now = new Date().toISOString();
      return [
        { id:uid(), title:'Capture all tasks in one place', note:'Example task. Move it through RCASE.', phase:'registration', done:false, createdAt:now },
        { id:uid(), title:'Clarify next action', note:'', phase:'analysis', done:false, createdAt:now }
      ];
    }
    function load(){
      try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || sampleTasks(); }
      catch { tasks = sampleTasks(); }
      save();
    }
    function renderPhaseOptions(){
      phaseInput.innerHTML = PHASES.map(p => '<option value="' + p.key + '">' + p.short + ' - ' + p.label + '</option>').join('');
    }
    function renderPhases(){
      phaseBar.innerHTML = PHASES.map(p => {
        const count = tasks.filter(t => t.phase === p.key && !t.done).length;
        const active = filter === p.key ? ' active' : '';
        return '<button type="button" class="phase-card ' + p.key + active + '" data-phasekey="' + p.key + '"><div class="phase-head"><span class="phase-short">' + p.short + '</span><span class="count">' + count + '</span></div><div class="phase-label">' + p.label + '</div></button>';
      }).join('');
    }
    function getVisibleTasks(){
      return tasks.filter(t => showDone || !t.done).filter(t => filter === 'all' || t.phase === filter).sort((a,b) => Number(a.done) - Number(b.done) || new Date(b.createdAt) - new Date(a.createdAt));
    }
    function renderTasks(){
      const visible = getVisibleTasks();
      allBtn.classList.toggle('primary', filter === 'all');
      if (!visible.length){ taskList.innerHTML = '<div class="empty">No tasks found. Capture one item and move it through RCASE.</div>'; return; }
      taskList.innerHTML = visible.map(task => {
        const p = phaseMeta(task.phase);
        return '<article class="task ' + (task.done ? 'done' : '') + '" data-id="' + task.id + '">' +
          '<div class="task-main">' +
          '<input class="done-check js-done" type="checkbox" ' + (task.done ? 'checked' : '') + '>' +
          '<div><div class="task-title-row"><span class="tag ' + p.key + '">' + p.short + '</span>' +
          '<input class="task-title js-title" value="' + escapeHtml(task.title) + '"></div>' +
          '<input class="task-note js-note" placeholder="Note" value="' + escapeHtml(task.note || '') + '"></div>' +
          '<div class="task-actions"><button type="button" class="js-prev">&lsaquo;</button><button type="button" class="js-next">&rsaquo;</button><button type="button" class="danger js-delete">&times;</button></div>' +
          '</div></article>';
      }).join('');
    }
    function render(){ renderPhases(); renderTasks(); }
    function updateTask(id, patch){ tasks = tasks.map(t => t.id === id ? Object.assign({}, t, patch) : t); save(); render(); }

    addForm.addEventListener('submit', e => {
      e.preventDefault();
      const title = titleInput.value.trim();
      if (!title) return;
      tasks = [{ id:uid(), title:title, note:noteInput.value.trim(), phase:phaseInput.value, done:false, createdAt:new Date().toISOString() }, ...tasks];
      titleInput.value = ''; noteInput.value = ''; phaseInput.value = 'registration'; save(); render(); titleInput.focus();
    });
    phaseBar.addEventListener('click', e => {
      const btn = e.target.closest('[data-phasekey]');
      if (!btn) return;
      filter = filter === btn.dataset.phasekey ? 'all' : btn.dataset.phasekey;
      render();
    });
    allBtn.addEventListener('click', () => { filter = 'all'; render(); });
    showDoneInput.addEventListener('change', () => { showDone = showDoneInput.checked; renderTasks(); });
    taskList.addEventListener('click', e => {
      const item = e.target.closest('[data-id]');
      if (!item) return;
      const id = item.dataset.id;
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      if (e.target.classList.contains('js-prev')) updateTask(id, { phase: prevPhase(task.phase) });
      if (e.target.classList.contains('js-next')) updateTask(id, { phase: nextPhase(task.phase) });
      if (e.target.classList.contains('js-delete')) { tasks = tasks.filter(t => t.id !== id); save(); render(); }
    });
    taskList.addEventListener('change', e => {
      if (!e.target.classList.contains('js-done')) return;
      const item = e.target.closest('[data-id]');
      if (item) updateTask(item.dataset.id, { done: e.target.checked });
    });
    taskList.addEventListener('input', e => {
      const item = e.target.closest('[data-id]');
      if (!item) return;
      const task = tasks.find(t => t.id === item.dataset.id);
      if (!task) return;
      if (e.target.classList.contains('js-title')) task.title = e.target.value;
      if (e.target.classList.contains('js-note')) task.note = e.target.value;
      save();
    });
    exportBtn.addEventListener('click', () => {
      const payload = { app:'STAIRCASE', version:'1.1', exportedAt:new Date().toISOString(), tasks:tasks };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'staircase-backup.json'; a.click(); URL.revokeObjectURL(url);
    });
    importFile.addEventListener('change', e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          const incoming = Array.isArray(parsed) ? parsed : parsed.tasks;
          if (!Array.isArray(incoming)) throw new Error('Invalid file');
          tasks = incoming.map(t => ({ id:t.id || uid(), title:t.title || '', note:t.note || '', phase:phaseMeta(t.phase).key, done:Boolean(t.done), createdAt:t.createdAt || new Date().toISOString() }));
          save(); render();
        } catch { alert('Import failed. Please select a valid STAIRCASE backup JSON file.'); }
      };
      reader.readAsText(file); e.target.value = '';
    });
    resetBtn.addEventListener('click', () => {
      if (!confirm('Reset to sample tasks? This will replace current local data.')) return;
      tasks = sampleTasks(); filter = 'all'; showDone = true; showDoneInput.checked = true; save(); render();
    });

    renderPhaseOptions(); load(); render();
  </script>
</body>
</html>
